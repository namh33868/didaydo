services:
  db:
    image: postgres:16-alpine
    container_name: didaydo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: diddaydo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - didaydo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diddaydo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  didaydo_postgres_data:
